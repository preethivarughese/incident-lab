version: '3.8'

services:

  # ──────────────────────────────────────────────
  # Inventory Service  →  http://localhost:8081
  # ──────────────────────────────────────────────
  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "8081:8081"
    networks:
      - incident-lab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Order Service  →  http://localhost:8080
  # ──────────────────────────────────────────────
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8080:8080"
    depends_on:
      inventory-service:
        condition: service_healthy
    networks:
      - incident-lab-net
    environment:
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Prometheus  →  http://localhost:9090
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - incident-lab-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Grafana  →  http://localhost:3000  (admin/admin)
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - incident-lab-net
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Loki — log aggregation (Prometheus for logs)
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - incident-lab-net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Promtail — reads order + inventory log files → Loki
  # NOTE: shipping-service has its own promtail container that handles
  # shipping logs. This one handles only incident-lab services.
  # Named "promtail-lab" to avoid conflict with shipping-service's "promtail"
  # ──────────────────────────────────────────────
  promtail-lab:
    image: grafana/promtail:2.9.4
    container_name: promtail-lab
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./inventory-service/logs:/logs/inventory:ro
      - ./order-service/logs:/logs/order:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - incident-lab-net
    restart: unless-stopped

networks:
  incident-lab-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
