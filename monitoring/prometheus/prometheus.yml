global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Services run on the HOST machine (java -jar), not in containers.
# host.containers.internal resolves to the host IP from inside Podman containers.

scrape_configs:

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.containers.internal:8080']
        labels:
          service: order-service

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.containers.internal:8081']
        labels:
          service: inventory-service

  - job_name: 'shipping-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.containers.internal:8082']
        labels:
          service: shipping-service

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
