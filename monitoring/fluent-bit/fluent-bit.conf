[SERVICE]
    Flush            1
    Daemon           Off
    Log_Level        info
    Parsers_File     /fluent-bit/etc/parsers.conf
    storage.metrics  on

# ── Read inventory-service JSON log file ──────────────────────
[INPUT]
    Name             tail
    Tag              inventory-service
    Path             /logs/inventory/*.log
    Parser           json
    DB               /data/flb_inventory.db
    Refresh_Interval 5
    Skip_Empty_Lines On
    Skip_Long_Lines  On

# ── Read order-service JSON log file ─────────────────────────
[INPUT]
    Name             tail
    Tag              order-service
    Path             /logs/order/*.log
    Parser           json
    DB               /data/flb_order.db
    Refresh_Interval 5
    Skip_Empty_Lines On
    Skip_Long_Lines  On

# ── Add a log_source field from the tag ───────────────────────
[FILTER]
    Name             modify
    Match            inventory-service
    Add              log_source inventory-service

[FILTER]
    Name             modify
    Match            order-service
    Add              log_source order-service

# ── Ship all logs to OpenSearch ───────────────────────────────
[OUTPUT]
    Name               opensearch
    Match              *
    Host               opensearch
    Port               9200
    Index              incident-lab-logs
    Suppress_Type_Name On
    tls                Off
    Time_Key           @timestamp
    Time_Key_Format    %Y-%m-%dT%H:%M:%S.%L%z
    Include_Tag_Key    On
    Tag_Key            fluent_tag
    Retry_Limit        5
