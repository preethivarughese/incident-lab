server:
  port: 8080

spring:
  application:
    name: order-service

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: order-service
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.incidentlab: DEBUG
